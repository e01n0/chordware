[project]
name = "tabsmith"
version = "0.1.0"
description = "Song in, banjo/guitar arrangement out. Local models only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "muscriptor>=0.3.0",
    "beat-this>=1.1.0",
    "audio-separator[gpu]>=0.47.0",
    "music21>=9.1",
    "yt-dlp>=2025.1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "pillow>=10",
    "audioread>=3.1.0",
]

[project.scripts]
tabsmith = "tabsmith.cli:main"
tabsmith-web = "tabsmith.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux'"]
